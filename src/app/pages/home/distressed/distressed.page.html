<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <app-common-header isFullLogoActivate="true" isLoggedAsActivate="true">
  </app-common-header>

  <ion-content *ngIf="user">
    <div *ngIf="serviceRole==='Distressed'">
      <form [formGroup]="DistressForm" novalidate>
        <ion-item>
          <ion-label position="floating">Full Name <ion-text color="danger">*</ion-text>
          </ion-label>
          <ion-input required type="text" formControlName="name"></ion-input>
        </ion-item>

        <ion-item disabled="true">
          <ion-icon name="call"></ion-icon>
          <ion-input required type="number" [value]="countryCode" formControlName="countryCode"></ion-input>
          <ion-input required type="number" [value]="PhoneNumber" formControlName="phone"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Age <ion-text color="danger">*</ion-text>
          </ion-label>
          <ion-input required type="number" formControlName="age"></ion-input>
        </ion-item>
        <ion-item formGroupName="address" (click)="getCurrentPosition()">
          <ion-icon name="locate-outline"></ion-icon>
          <ion-input placeholder="Address" type="text" formControlName="formattedAddress" readonly></ion-input>
        </ion-item>

        <ion-list>
          <ion-toolbar>
            <ion-title size="large" slot="start">SOS Reason</ion-title>
          </ion-toolbar>
          <ion-radio-group [value]="selectedRadio">
            <ion-item *ngFor="let item of checkBoxList">
              <ion-label>{{ item.name }}</ion-label>
              <ion-radio slot="start" [value]="item.value" (click)="selectRadio(item.value)"></ion-radio>
            </ion-item>
          </ion-radio-group>
        </ion-list>

        <div class="ion-padding">
          <ion-button expand="block" (click)="raiseDistress()">Raise Distress</ion-button>
        </div>
      </form>
      <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button [routerLink]="['/home/distressed/chatbot']">
          <ion-icon name="chatbox"></ion-icon>
        </ion-fab-button>
      </ion-fab>
    </div>
  </ion-content>
</ion-app>
